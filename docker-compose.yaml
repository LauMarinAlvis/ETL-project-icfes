version: '3.8'
services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_saber11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: icfes_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --max_allowed_packet=512M --local_infile=1
volumes:
  mysql_data: